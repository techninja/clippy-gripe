<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document1 - Microsoft Word</title>
    <meta name="description" content="A blank Word 97 document. Start typing. Clippy will judge you." />

    <!-- OG / Twitter card -->
    <meta property="og:title" content="Document1 - Microsoft Word" />
    <meta property="og:description" content="A blank Word 97 document. Start typing. Clippy will judge you." />
    <meta property="og:image" content="https://clippy.gripe/og.png" />
    <meta property="og:url" content="https://clippy.gripe/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://clippy.gripe/og.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#008080" />

    <style>html,body{background:#008080;margin:0}</style>
    <link rel="stylesheet" href="/styles/reset.css" />
    <link rel="stylesheet" href="/styles/desktop.css" />
    <link rel="stylesheet" href="/styles/taskbar.css" />
    <link rel="stylesheet" href="/styles/word.css" />

    <script type="importmap">
      {
        "imports": {
          "hybrids": "/vendor/hybrids/index.js",
          "clippyjs": "/vendor/clippyjs/index.mjs",
          "clippyjs/agents/clippy": "/vendor/clippyjs/agents/clippy/index.mjs",
          "#store/": "/store/",
          "#utils/": "/utils/",
          "#atoms/": "/components/atoms/",
          "#molecules/": "/components/molecules/",
          "#organisms/": "/components/organisms/",
          "#templates/": "/components/templates/",
          "#pages/": "/pages/"
        }
      }
    </script>
  </head>
  <body>
    <noscript>
      <div style="font-family:system-ui;padding:2rem;max-width:40rem;margin:4rem auto;text-align:center">
        <h1>JavaScript required</h1>
        <p>clippy-gripe requires JavaScript to run. Please enable it in your browser settings.</p>
      </div>
    </noscript>
    <app-router></app-router>
    <script type="module" src="/router/index.js"></script>
    <script>
      window.addEventListener('unhandledrejection', (e) => {
        console.error('[app] Unhandled rejection:', e.reason);
      });
      window.addEventListener('error', (e) => {
        console.error('[app] Uncaught error:', e.message, e.filename, e.lineno);
      });
    </script>
  </body>
</html>
